# cliff.toml — git-cliff configuration for CrossLingua releases
# Docs: https://git-cliff.org/docs/configuration
# Verified against git-cliff 2.13.x (2026)
#
# Used by .github/workflows/release.yml (via orhun/git-cliff-action) to build
# the GitHub Release body from Conventional Commits since the previous tag.

[changelog]
# No big "# Changelog" header — the GitHub Release title already carries the
# version, and the workflow additionally passes `--strip header`.
header = ""
# Tera template rendered for each release section.
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = "<!-- generated by git-cliff -->"
# Remove leading/trailing whitespace from the rendered body.
trim = true
postprocessors = [
    # Collapse 3+ consecutive blank lines into a single blank line.
    { pattern = '\n{3,}', replace = "\n\n" },
    # Optional: linkify issue/PR references. Uncomment to turn "(#123)" into a
    # link. Keep the URL pointed at this fork.
    # { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/ed-fruty/crosslingua-reader/issues/${1}))" },
]

[git]
# Parse commits according to the Conventional Commits spec.
conventional_commits = true
# Keep non-conventional commits too, so nothing silently disappears (they land
# in "Other").
filter_unconventional = false
# Do not split commit bodies into multiple entries.
split_commits = false
# Regex preprocessing applied to each commit message before parsing.
commit_preprocessors = [
    # Collapse runs of spaces.
    { pattern = '  +', replace = " " },
]
# Ordered rules; first match wins. The `<!-- N -->` prefixes drive section
# order and are stripped at render time via `striptags`.
commit_parsers = [
    # --- noise: dropped entirely ---
    { message = "^Merge branch", skip = true },
    { message = "^Merge pull request", skip = true },
    { message = "^Merge remote-tracking", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },

    # --- grouped sections ---
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
    { message = "^test", group = "<!-- 5 -->🧪 Testing" },
    { message = "^style", group = "<!-- 6 -->🎨 Styling" },
    { message = "^revert", group = "<!-- 7 -->◀️ Revert" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    # Remaining chore/ci/build land in a low-priority "Miscellaneous" bucket.
    # (Flip to `skip = true` if you'd rather drop them entirely.)
    { message = "^chore|^ci|^build", group = "<!-- 9 -->⚙️ Miscellaneous Tasks" },

    # --- catch-all ---
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# Keep breaking-change commits even if their type would otherwise be skipped.
protect_breaking_commits = true
# Don't drop commits by author/path — grouping already handles noise.
filter_commits = false
# Only consider version tags (v1.2.0, v2.0.0-rc.1, ...) when computing ranges.
tag_pattern = "v[0-9]*"
# Chronological (not topological) ordering.
topo_order = false
# Newest commit first within each group.
sort_commits = "newest"
