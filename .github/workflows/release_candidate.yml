name: Compile Release Candidate

on:
  workflow_dispatch:

jobs:
  build-release-candidate:
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Extract env
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BRANCH_SUFFIX=${GITHUB_REF_NAME#release/}" >> $GITHUB_ENV

      - name: Build CrossPoint Release Candidate
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: pio run -e gh_release_rc

      # Mirrors release.yml. Optional for RC testers -- EdsLab is built into the
      # firmware -- but kept so an updated font cut can be tried without a reflash.
      - name: Install font tools
        run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev
          pip install freetype-py fonttools pyyaml

      - name: Build EdsLab SD card font
        run: python3 lib/EpdFont/scripts/build-sd-fonts.py --only EdsLab --clean

      - name: Package EdsLab for the SD card
        run: |
          # Extracting this zip at the SD card root yields /fonts/EdsLab/*.cpfont.
          mkdir -p dist/sdcard/fonts/EdsLab
          cp lib/EpdFont/scripts/output/EdsLab/*.cpfont dist/sdcard/fonts/EdsLab/
          cp lib/EpdFont/builtinFonts/source/EdsLab/LICENSE.txt dist/sdcard/fonts/EdsLab/
          (cd dist/sdcard && zip -r ../EdsLab-sdcard-font.zip fonts)
          ls -l dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-RC-${{ env.BRANCH_SUFFIX }}
          path: |
            .pio/build/gh_release_rc/bootloader.bin
            .pio/build/gh_release_rc/firmware.bin
            .pio/build/gh_release_rc/firmware.elf
            .pio/build/gh_release_rc/firmware.map
            .pio/build/gh_release_rc/partitions.bin
            dist/EdsLab-sdcard-font.zip
