name: Compile Release

# Builds every board's release firmware on tag push (tags look like
# v<crosslingua>+crosspoint.<crosspoint>, matching the gh_release envs'
# CROSSPOINT_VERSION) and publishes each binary under two names:
#   crosslingua-<crosslingua version>-<device>.bin  what OtaUpdater requests now
#   firmware.bin / firmware-<board>.bin              what CrossLingua <= 1.4.x
#                                                    requests (legacy OTA)
# Both names carry the same binary, so devices on any release can update.
#
# Every release also carries the Word Lens gloss packs, committed as one archive
# (lingua-data/wordlens/word-lens-packs.tar.xz) and published unpacked: word-lens-<pair>.lens,
# word-lens-manifest.json and word-lens-ATTRIBUTION.md. Devices fetch them from
# releases/latest/download/, so they must be on the latest (non-prerelease) release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            device: x3-x4
            legacy_asset: firmware.bin
          - pio_env: sticky-gh_release
            device: sticky
            legacy_asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release
            device: x4pro
            legacy_asset: firmware-x4pro.bin
          - pio_env: x4c-gh_release
            device: x4c
            legacy_asset: firmware-x4c.bin
          - pio_env: papermono-gh_release
            device: papermono
            legacy_asset: firmware-papermono.bin
          - pio_env: metalio_eink4-gh_release
            device: metalio_eink4
            legacy_asset: firmware-metalio_eink4.bin
          - pio_env: eego_a4-gh_release
            device: eego_a4
            legacy_asset: firmware-eego_a4.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate release tag
        # OtaUpdater compares the tag against the running CROSSPOINT_VERSION, so
        # the tag must be exactly v<crosslingua.version>+crosspoint.<crosspoint.version>.
        run: |
          crosslingua="$(sed -n '/^\[crosslingua\]/,/^\[/s/^version = //p' platformio.ini | head -n1)"
          crosspoint="$(sed -n '/^\[crosspoint\]/,/^\[/s/^version = //p' platformio.ini | head -n1)"
          expected="v${crosslingua}+crosspoint.${crosspoint}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match platformio.ini version $expected"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v2-${{ runner.os }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.pio_env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossLingua
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Prepare firmware assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          mkdir -p dist/firmware
          cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" "dist/firmware/crosslingua-${version}-${{ matrix.device }}.bin"
          cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" "dist/firmware/${{ matrix.legacy_asset }}"

      - name: Install font tools
        if: matrix.pio_env == 'gh_release'
        run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev
          pip install freetype-py fonttools pyyaml

      - name: Package EdsLab SD card font
        if: matrix.pio_env == 'gh_release'
        run: |
          python3 lib/EpdFont/scripts/build-sd-fonts.py --only EdsLab --clean
          mkdir -p dist/sdcard/fonts/EdsLab
          cp lib/EpdFont/scripts/output/EdsLab/*.cpfont dist/sdcard/fonts/EdsLab/
          cp lib/EpdFont/builtinFonts/source/EdsLab/LICENSE.txt dist/sdcard/fonts/EdsLab/
          (cd dist/sdcard && zip -r ../EdsLab-sdcard-font.zip fonts)

      - name: Upload EdsLab artifact
        if: matrix.pio_env == 'gh_release'
        uses: actions/upload-artifact@v6
        with:
          name: CrossLingua-EdsLab-sdcard-font
          path: dist/EdsLab-sdcard-font.zip

      - name: Stage firmware assets
        uses: actions/upload-artifact@v6
        with:
          name: CrossLingua-firmware-${{ matrix.device }}
          path: dist/firmware/*.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CrossLingua-debug-${{ matrix.device }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/firmware.bin
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          pattern: CrossLingua-firmware-*
          path: dist/firmware
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Stage Word Lens packs
        # Unpacks the archive and checks every pack against the manifest's sha256/size before it is
        # published: one asset per manifest pack, plus the manifest and the attribution.
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json, tarfile; t = tarfile.open("lingua-data/wordlens/word-lens-packs.tar.xz"); print(len(json.load(t.extractfile("word-lens-manifest.json"))["packs"]) + 2)')"
          staged="$(python3 scripts/wordlens/stage_release_assets.py --out dist/wordlens)"
          test "$staged" -eq "$expected"
          test "$(find dist/wordlens -maxdepth 1 -type f | wc -l)" -eq "$expected"
          test "$(find dist/wordlens -maxdepth 1 -type f -name 'word-lens-*.lens' | wc -l)" -eq "$((expected - 2))"

      - name: Verify firmware assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          for device in x3-x4 sticky x4pro x4c papermono metalio_eink4 eego_a4; do
            test -f "dist/firmware/crosslingua-${version}-${device}.bin"
          done
          for legacy in firmware.bin firmware-sticky.bin firmware-x4pro.bin firmware-x4c.bin \
                        firmware-papermono.bin firmware-metalio_eink4.bin firmware-eego_a4.bin; do
            test -f "dist/firmware/${legacy}"
          done
          test "$(find dist/firmware -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 14

      - name: Generate changelog
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CrossLingua ${{ github.ref_name }}
          body: ${{ steps.git_cliff.outputs.content }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/firmware/*.bin
            dist/wordlens/*
