name: Compile Release
on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e gh_release

      # EdsLab is built into the firmware and is the default reading font, so
      # this zip is OPTIONAL for users -- nobody has to install anything to read
      # in EdsLab. It is published anyway for two reasons: an updated cut of the
      # font can reach existing devices without reflashing, and the SD build uses
      # a wider interval set than the built-in one (it adds the numero sign, see
      # sd-fonts.yaml). The other SD families come from release-fonts.yml.
      - name: Install font tools
        run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev
          pip install freetype-py fonttools pyyaml

      - name: Build EdsLab SD card font
        run: python3 lib/EpdFont/scripts/build-sd-fonts.py --only EdsLab --clean

      - name: Package EdsLab for the SD card
        run: |
          # Lay the zip out so extracting it at the SD card root yields
          # /fonts/EdsLab/*.cpfont, one of the two roots SdCardFontRegistry
          # scans. The visible root is used rather than /.fonts so the folder
          # is not invisible in the user's file manager after extraction.
          mkdir -p dist/sdcard/fonts/EdsLab
          cp lib/EpdFont/scripts/output/EdsLab/*.cpfont dist/sdcard/fonts/EdsLab/
          cp lib/EpdFont/builtinFonts/source/EdsLab/LICENSE.txt dist/sdcard/fonts/EdsLab/
          (cd dist/sdcard && zip -r ../EdsLab-sdcard-font.zip fonts)
          ls -l dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            dist/EdsLab-sdcard-font.zip
